name: Refresh Yahoo news snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-yahoo-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Yahoo RSS feeds
        run: node scripts/update-news.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- dist/latest-news.json; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/latest-news.json
          git commit -m "Refresh Yahoo news snapshot"
          git push
