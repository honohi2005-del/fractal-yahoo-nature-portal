<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d8efd4" />
    <meta
      name="description"
      content="Yahoo! JAPANの主要導線を、広告を排したフラクタルな自然風景へ埋め込む実験的ポータル。"
    />
    <title>情報の森 — Fractal Yahoo Nature Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="https://www.yahoo.co.jp/" target="_blank" rel="noreferrer">
          <span class="brand-mark" aria-hidden="true">◒</span>
          <span class="brand-copy">
            <span class="brand-kicker">YAHOO! JAPAN / RECOMPOSED</span>
            <span class="brand-title">情報の森</span>
          </span>
        </a>
        <div class="topbar-meta">
          <span class="signal-dot" aria-hidden="true"></span>
          <time id="localClock" datetime=""></time>
          <button class="icon-button" id="quietButton" type="button" aria-pressed="false" aria-label="静かな表示に切り替える">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14.5V10a8 8 0 0 1 16 0v4.5M2.5 14.5h19M7 18.5a5 5 0 0 0 10 0M12 2v2" /></svg>
          </button>
        </div>
      </header>

      <main class="forest-stage" id="forestStage">
        <canvas id="forestCanvas" aria-hidden="true"></canvas>
        <div class="atmosphere atmosphere-one" aria-hidden="true"></div>
        <div class="atmosphere atmosphere-two" aria-hidden="true"></div>

        <section class="intro" aria-labelledby="pageTitle">
          <h1 id="pageTitle">情報の森</h1>
        </section>

        <form class="search-orbit" id="searchForm" role="search">
          <label class="sr-only" for="searchInput">Yahoo! JAPANで検索</label>
          <span class="search-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4" /><path d="m16 16 5 5" /></svg>
          </span>
          <input id="searchInput" name="q" type="search" autocomplete="off" placeholder="森の中を検索" />
          <button type="submit" aria-label="Yahoo! JAPANで検索する">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </form>

        <p class="map-caption" aria-hidden="true">NAVIGATE BY GROWTH</p>

        <nav class="portal-map" id="portalMap" aria-label="Yahoo! JAPANニュースのカテゴリ">
          <a class="portal-node node-major" href="https://news.yahoo.co.jp/" target="_blank" rel="noreferrer" data-node="major" data-label="主要" data-note="ニュースの主要な話題へ" style="--x: 17%; --y: 34%; --accent: #2d7d59;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v13H5zM8 9h8M8 12h8M8 15h5" /></svg></span><span class="node-label">主要</span>
          </a>
          <a class="portal-node node-economy" href="https://news.yahoo.co.jp/categories/business" target="_blank" rel="noreferrer" data-node="economy" data-label="経済" data-note="経済と市場の話題へ" style="--x: 33%; --y: 20%; --accent: #9a6b1f;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 18.5 10 13l3 3 6-8M18 8h1v1" /></svg></span><span class="node-label">経済</span>
          </a>
          <a class="portal-node node-entertainment" href="https://news.yahoo.co.jp/categories/entertainment" target="_blank" rel="noreferrer" data-node="entertainment" data-label="エンタメ" data-note="映画・音楽・芸能の話題へ" style="--x: 51%; --y: 17%; --accent: #9b4f75;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z" /><path d="M5 4v2M4 5h2" /></svg></span><span class="node-label">エンタメ</span>
          </a>
          <a class="portal-node node-sports" href="https://news.yahoo.co.jp/categories/sports" target="_blank" rel="noreferrer" data-node="sports" data-label="スポーツ" data-note="試合結果と速報へ" style="--x: 69%; --y: 22%; --accent: #3f7090;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><path d="m8 7 2 4 4 1 3-3M10 11l-2.5 5M14 12l2 5" /></svg></span><span class="node-label">スポーツ</span>
          </a>
          <a class="portal-node node-domestic" href="https://news.yahoo.co.jp/categories/domestic" target="_blank" rel="noreferrer" data-node="domestic" data-label="国内" data-note="日本国内のニュースへ" style="--x: 83%; --y: 37%; --accent: #397d6c;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4.5 11 7.5-6 7.5 6v8.5h-15zM9 19.5v-5h6v5M7.5 10h9" /></svg></span><span class="node-label">国内</span>
          </a>
          <a class="portal-node node-world" href="https://news.yahoo.co.jp/categories/world" target="_blank" rel="noreferrer" data-node="world" data-label="国際" data-note="世界のニュースへ" style="--x: 18%; --y: 58%; --accent: #466c9b;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M4.5 12h15M12 4c2.2 2.2 3.3 4.9 3.3 8s-1.1 5.8-3.3 8c-2.2-2.2-3.3-4.9-3.3-8S9.8 6.2 12 4Z" /></svg></span><span class="node-label">国際</span>
          </a>
          <a class="portal-node node-it" href="https://news.yahoo.co.jp/categories/it" target="_blank" rel="noreferrer" data-node="it" data-label="IT" data-note="テクノロジーのニュースへ" style="--x: 34%; --y: 73%; --accent: #5a6ca2;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="11" rx="1.5" /><path d="M8 20h8M12 16.5V20M8.5 9.5l2.5 2-2.5 2M13.5 13.5h2" /></svg></span><span class="node-label">IT</span>
          </a>
          <a class="portal-node node-science" href="https://news.yahoo.co.jp/categories/science" target="_blank" rel="noreferrer" data-node="science" data-label="化学" data-note="科学と自然のニュースへ" style="--x: 51%; --y: 84%; --accent: #708b3f;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4.5h6M10 4.5v5.2l-4.5 7.1A1.7 1.7 0 0 0 7 19.5h10a1.7 1.7 0 0 0 1.5-2.7L14 9.7V4.5M8 15h8" /></svg></span><span class="node-label">化学</span>
          </a>
          <a class="portal-node node-local" href="https://news.yahoo.co.jp/categories/local" target="_blank" rel="noreferrer" data-node="local" data-label="地域" data-note="地域のニュースへ" style="--x: 68%; --y: 70%; --accent: #9b7045;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20s6-5.7 6-10.3a6 6 0 1 0-12 0C6 14.3 12 20 12 20Z" /><circle cx="12" cy="9.7" r="2" /></svg></span><span class="node-label">地域</span>
          </a>
          <a class="portal-node node-weather" href="https://weather.yahoo.co.jp/" target="_blank" rel="noreferrer" data-node="weather" data-label="天気" data-note="空模様と災害情報へ" style="--x: 84%; --y: 61%; --accent: #b77c2a;">
            <span class="node-orbit"></span><span class="node-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18h10a3.5 3.5 0 0 0 .5-7A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18Z" /><path d="M7 5v1.5M4.3 7.1l1 1M15.7 7.1l-1 1" /></svg></span><span class="node-label">天気</span>
          </a>
        </nav>

        <aside class="detail-panel" id="detailPanel" aria-live="polite" aria-hidden="true">
          <button class="detail-close" id="detailClose" type="button" aria-label="詳細を閉じる">×</button>
          <div class="detail-icon" id="detailIcon" aria-hidden="true"></div>
          <p class="detail-kicker" id="detailKicker">PORTAL NODE</p>
          <h2 id="detailTitle">ニュース</h2>
          <p id="detailNote">今日の主要な話題へ</p>
          <a class="detail-link" id="detailLink" href="https://news.yahoo.co.jp/" target="_blank" rel="noreferrer">入口をひらく <span aria-hidden="true">↗</span></a>
        </aside>

        <div class="bottom-ribbon">
          <div class="ribbon-item"><span class="ribbon-glyph" aria-hidden="true">☼</span><span>LIVE</span><span class="ribbon-value">Y!J</span></div>
          <div class="ribbon-item"><span class="ribbon-glyph" aria-hidden="true">⌁</span><span>MODE</span><span class="ribbon-value" id="modeValue">FLOW</span></div>
          <button class="bottom-link" id="resetButton" type="button">森をリセット <span aria-hidden="true">↺</span></button>
        </div>
      </main>

      <footer class="footer-line">
        <span>広告のない再構成 / 情報の入口だけを残す</span>
        <a href="https://www.yahoo.co.jp/" target="_blank" rel="noreferrer">Yahoo! JAPAN 本体へ ↗</a>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
